<style>
:root{
  --ink:#111111;
  --ink-2:#4A4A4A;
  --paper:#F7F7F5;
  --white:#FFFFFF;
  --coral:#FF3B30;
  --coral-ink:#C4291F;
  --kakao:#FEE500;
  --kakao-hover:#F5DC00;
  --kakao-ink:#191600;
  --naver:#03C75A;
  --naver-hover:#02B351;
  --muted:#5F5F5D;
  --dim:#84847F;
  --line:#E5E5E3;
  --line-strong:#D5D5D2;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;
  min-height:100svh;
  display:flex;
  justify-content:center;
  padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));
  background-color:var(--white);
  background-image:radial-gradient(115% 55% at 50% -8%,rgba(255,59,48,.07) 0%,rgba(255,59,48,.03) 38%,rgba(255,59,48,0) 68%);
  background-repeat:no-repeat;
  color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
a{color:inherit}
.hub{
  width:100%;
  max-width:436px;
  min-height:calc(100svh - 44px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:10px 0;
}
.hub-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--dim);
}
.hub-top .top-left{color:var(--coral-ink)}
.hub-top .top-right{color:var(--muted);letter-spacing:.1em}
.brand{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:2px 8px;
  margin:26px 0 0;
  font-size:12px;
  font-weight:600;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:var(--ink);
}
.brand .brand-nl{
  font-family:var(--mono);
  font-size:16px;
  letter-spacing:.02em;
  color:var(--coral-ink);
}
.brand .brand-ko{
  font-size:11.5px;
  font-weight:500;
  letter-spacing:.14em;
  color:var(--muted);
}
.slogan{
  margin:16px 0 0;
  font-size:clamp(22px,7vw,29px);
  font-weight:700;
  line-height:1.42;
  letter-spacing:-.028em;
  word-break:keep-all;
}
.slogan em{font-style:normal;color:var(--coral-ink)}
.slogan .dot{color:var(--coral)}
.rule{
  height:0;
  margin:28px 0 18px;
  border:0;
  border-top:1px solid var(--line);
}
.links{display:flex;flex-direction:column;gap:10px}
.link{
  position:relative;
  display:grid;
  grid-template-columns:auto auto minmax(0,1fr) auto;
  align-items:center;
  gap:12px;
  min-height:66px;
  padding:14px 15px;
  border:1px solid var(--line-strong);
  border-radius:3px;
  background:var(--white);
  text-decoration:none;
  color:var(--ink);
  transition:background-color .22s ease,border-color .22s ease,transform .18s ease;
}
.link:hover{background:var(--paper);border-color:var(--ink)}
.link:active{transform:translateY(1px)}
.link:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
.link-no{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.06em;
  color:var(--dim);
}
.link-icon{
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:2px;
  background:var(--paper);
  font-size:17px;
  line-height:1;
}
.link-svg{display:block;width:20px;height:20px}
.link-body{min-width:0}
.link-label{
  display:block;
  font-size:15px;
  font-weight:600;
  letter-spacing:-.015em;
  line-height:1.35;
}
.link-sub{
  display:block;
  margin-top:3px;
  font-size:11.5px;
  line-height:1.4;
  color:var(--muted);
  letter-spacing:.005em;
}
.link-arrow{
  font-size:13px;
  color:var(--dim);
  transition:transform .22s ease,color .22s ease;
}
.link:hover .link-arrow,
.link:focus-visible .link-arrow{transform:translateX(4px);color:var(--ink)}
.link--primary{
  border-color:var(--kakao);
  background:var(--kakao);
  color:var(--kakao-ink);
  box-shadow:0 12px 30px -20px rgba(25,22,0,.45);
}
.link--primary .link-no{color:rgba(25,22,0,.52)}
.link--primary .link-icon{border-color:rgba(25,22,0,.16);background:rgba(25,22,0,.06);color:var(--kakao-ink)}
.link--primary .link-label{font-weight:700}
.link--primary .link-sub{color:rgba(25,22,0,.78)}
.link--primary .link-arrow{color:rgba(25,22,0,.72)}
.link--primary:hover{background:var(--kakao-hover);border-color:var(--kakao-hover)}
.link--primary:hover .link-arrow,
.link--primary:focus-visible .link-arrow{color:var(--kakao-ink)}
.link--primary:focus-visible{outline-color:var(--ink)}
/* 네이버 블로그 — 네이버 그린 타일 엠블럼과 그린 계열 호버 */
.link-icon--naver{
  border-color:var(--naver);
  background:var(--naver);
  box-shadow:0 6px 18px -12px rgba(3,199,90,.5);
}
.link-icon--naver .link-svg{width:25px;height:25px}
.link--naver:hover{
  background:rgba(3,199,90,.06);
  border-color:rgba(3,199,90,.5);
}
.link--naver:hover .link-icon--naver,
.link--naver:focus-visible .link-icon--naver{
  background:var(--naver-hover);
  border-color:var(--naver-hover);
}
.link--naver:hover .link-arrow,
.link--naver:focus-visible .link-arrow{color:var(--naver)}
.hub-foot{
  margin:26px 0 0;
  padding-top:14px;
  border-top:1px solid var(--line);
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.01em;
  line-height:1.9;
  color:var(--muted);
}
.hub-foot p{margin:0;display:flex;flex-wrap:wrap;align-items:center;column-gap:2px}
.hub-foot a{
  display:inline-flex;
  align-items:center;
  min-height:44px;
  padding:0 4px;
  margin:0 -2px;
  color:var(--muted);
  text-decoration:none;
  transition:color .2s ease;
}
.hub-foot a:hover,.hub-foot a:focus-visible{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.hub-foot .sep{color:#C9C9C5;margin:0 6px}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
@media (max-width:360px){
  body{padding-left:16px;padding-right:16px}
  .link{gap:10px;padding:13px 13px;min-height:62px}
  .link-label{font-size:14px}
  .link-sub{font-size:11px}
  .link-icon{width:34px;height:34px;font-size:16px}
  .link-svg{width:18px;height:18px}
  .link-icon--naver .link-svg{width:22px;height:22px}
  .link-arrow{font-size:12px}
}
@media (min-width:600px){
  body{padding:40px 24px}
  .hub{max-width:420px;min-height:auto}
  .link{min-height:70px;padding:16px 17px}
}
@media (max-height:680px){
  .hub{justify-content:flex-start}
  .brand{margin-top:20px}
  .slogan{font-size:23px}
  .rule{margin:22px 0 14px}
  .link{min-height:60px;padding:12px 14px}
  .hub-foot{margin-top:20px}
}
@keyframes hubRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hub-top,.brand,.slogan,.rule,.links,.hub-foot{animation:hubRise .55s cubic-bezier(.22,1,.36,1) both}
.brand{animation-delay:.04s}
.slogan{animation-delay:.08s}
.rule{animation-delay:.12s}
.links{animation-delay:.16s}
.hub-foot{animation-delay:.24s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>{{analytics_head}}
</head>
<body>
<main class="hub">
  <p class="hub-top"><span class="top-left">NL. LINK</span><span class="top-right">{{region_line}}</span></p>

  <h1 class="brand"><span class="brand-nl">NL.</span><span>NOTICE LAB</span><span class="brand-ko">· 노티스랩</span></h1>

  <p class="slogan">조회수가 아닌<br><em>매출</em>을 연구합니다<span class="dot">.</span></p>

  <hr class="rule">

  <nav class="links" aria-label="노티스랩 주요 링크">
{{link_rows}}
  </nav>

  <footer class="hub-foot">
    <p>대표 {{business_ceo}}<span class="sep">|</span><a href="{{biz_tel}}">{{business_phone}}</a><span class="sep">|</span><a href="mailto:{{business_email}}">{{business_email}}</a></p>
  </footer>
</main>
</body>
