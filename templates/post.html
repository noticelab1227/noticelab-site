<article class="post">
  <header class="post-hero">
    <div class="wrap post-hero-inner">
      <nav class="breadcrumb" aria-label="현재 위치">
        <a href="/">홈</a><span aria-hidden="true">/</span>
        <a href="/insights/">인사이트</a><span aria-hidden="true">/</span>
        <span aria-current="page">{{post_category}}</span>
      </nav>
      <p class="post-meta">
        <span class="badge badge--{{post_category}}">{{post_category}}</span>
        <time datetime="{{post_date_iso}}">{{post_date}}</time>
        <span>읽는 시간 약 {{post_reading_time}}분</span>
      </p>
      <h1 class="post-title">{{post_title}}</h1>
      <p class="post-lede">{{post_description}}</p>
    </div>
  </header>

  <div class="wrap post-layout">
    <div class="post-main">
      {{post_cover}}
      <div class="article">
        {{post_body}}
        {{post_cta}}
      </div>

      <section class="related" aria-labelledby="related-title">
        <h2 class="related-title" id="related-title">이어서 읽기</h2>
        <div class="cards">
          {{related_cards}}
        </div>
      </section>
    </div>

    <aside class="post-aside">
      {{post_toc}}
    </aside>
  </div>
</article>
